<div class="calendar-page">
  <aside class="sidebar">
    <h2>Classroom</h2>

    <button class="menu-btn">Subjects</button>
    <button class="menu-btn">Tasks</button>

    <div class="agenda-box">
      <h3>Agenda</h3>
      <p>Today: No tasks yet</p>
      <p>Tomorrow: No tasks yet</p>
    </div>

    <button class="logout-btn">Logout</button>
  </aside>

  <main class="calendar-main">
    <div class="calendar-header">
      <button (click)="previousMonth()">&lt;</button>
      <h1>{{ monthName }} {{ year }}</h1>
      <button (click)="nextMonth()">&gt;</button>
    </div>

    <div class="weekdays">
      <div class="weekday" *ngFor="let day of weekDays">
        {{ day }}
      </div>
    </div>

    <div class="calendar-grid">
      <div class="calendar-cell" *ngFor="let day of calendarDays" [class.empty]="!day.isCurrentMonth"
        [class.today]="day.isToday">
        <div class="day-number" *ngIf="day.dayNumber">
          {{ day.dayNumber }}
        </div>

        <button class="add-task-btn" *ngIf="day.dayNumber" (click)="openTaskBox(day.dayNumber)">
          Add Task
        </button>

        <div class="task-list">
          <div class="task-item" *ngFor="let task of getTasksForDay(day.dayNumber)"
            [style.background-color]="task.color" (click)="openTaskDetails(task)">
            <span class="task-time" *ngIf="getTaskTimeDisplay(task)">
              {{ getTaskTimeDisplay(task) }}
            </span>

            <span>
              {{ getShortTaskText(task.text) }}
            </span>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="task-modal" *ngIf="showTaskBox">
  <div class="task-box">
    <h2>{{ selectedTask ? 'Edit Task' : 'Add Task' }}</h2>

    <label>Category</label>
    <input type="text" [(ngModel)]="newTaskCategory" placeholder="Example: Work" />

    <label>Start Time</label>
    <input type="time" [(ngModel)]="newTaskStartTime" />

    <label>End Time</label>
    <input type="time" [(ngModel)]="newTaskEndTime" />

    <label>Task</label>
    <textarea [(ngModel)]="newTaskText" placeholder="Write your task here"></textarea>

    <label>Color</label>
    <select [(ngModel)]="newTaskColor">
      <option *ngFor="let color of colorOptions" [value]="color">
        {{ color }}
      </option>
    </select>

    <div class="task-buttons">
      <button *ngIf="!selectedTask" (click)="addTask()">Save Task</button>

      <button *ngIf="selectedTask" (click)="saveEditedTask()">
        Save Changes
      </button>

      <button *ngIf="selectedTask" class="delete-btn" (click)="deleteTask()">
        Delete Task
      </button>

      <button (click)="closeTaskBox()">Cancel</button>
    </div>
  </div>
</div>
