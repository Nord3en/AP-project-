<div class="profile-page">
    <div class="profile-card">
        <h2>Edit Profile</h2>

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" [(ngModel)]="userName" name="userName">
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" [(ngModel)]="userEmail" name="userEmail">
        </div>

        <div class="form-group">
            <label>New Password</label>
            <input type="password" [(ngModel)]="newPassword" name="newPassword" placeholder="Enter new password">
        </div>

        <button class="btn-save" (click)="saveChanges()">Update Settings</button>

        <button class="btn-delete" (click)="deleteProfile()">Delete My Account</button>

        <button class="btn-back" routerLink="/calendar">Back to Calendar</button>
        
    </div>
</div>
