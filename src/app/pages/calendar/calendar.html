<div class="calendar-page">
    <aside class="sidebar">
        <h2>Classroom</h2>

        <button class="menu-btn">Calendar</button>
        <button class="menu-btn">Subjects</button>
        <button class="menu-btn">Tasks</button>

        <div class="agenda-box">
            <h3>Agenda</h3>

            <div class="agenda-section">
                <h4>Today</h4>
                <p *ngIf="todayTasks.length === 0">No tasks yet</p>

                <div class="agenda-task" *ngFor="let task of todayTasks" (click)="editTask(task)">
                    <span>{{ task.startTime }}</span>
                    {{ task.text }}
                </div>
            </div>

            <div class="agenda-section">
                <h4>Tomorrow</h4>
                <p *ngIf="tomorrowTasks.length === 0">No tasks yet</p>

                <div class="agenda-task" *ngFor="let task of tomorrowTasks" (click)="editTask(task)">
                    <span>{{ task.startTime }}</span>
                    {{ task.text }}
                </div>
            </div>
        </div>

        <button class="logout-btn">Logout</button>
    </aside>

    <main class="calendar-main">
        <div class="calendar-header">
            <button (click)="previousMonth()">&#60;</button>
            <h1>{{ monthName }} {{ year }}</h1>
            <button (click)="nextMonth()">&#62;</button>
        </div>

        <div class="weekdays">
            <div class="weekday" *ngFor="let day of weekDays">
                {{ day }}
            </div>
        </div>

        <div class="calendar-grid">
            <div class="calendar-cell" *ngFor="let day of calendarDays" [class.empty]="!day.isCurrentMonth"
                [class.today]="day.isToday">
                <div class="day-number" *ngIf="day.dayNumber">
                    {{ day.dayNumber }}
                </div>

                <button class="add-task-btn" *ngIf="day.dayNumber" (click)="openAddTask(day.dayNumber)">
                    Add Task
                </button>

                <div class="task" *ngFor="let task of getTasksForDay(day.dayNumber)"
                    [style.backgroundColor]="task.color" (click)="editTask(task)">
                    <span>{{ task.startTime }}</span>
                    {{ task.text }}
                </div>
            </div>
        </div>
    </main>
</div>

<div class="task-modal" *ngIf="showTaskBox">
    <div class="task-box">
        <h2>{{ editingTask ? 'Edit Task' : 'Add Task' }}</h2>

        <label>Category</label>
        <input type="text" [(ngModel)]="newCategory">

        <label>Start Time</label>
        <input type="time" [(ngModel)]="newStartTime">

        <label>End Time</label>
        <input type="time" [(ngModel)]="newEndTime">

        <label>Task</label>
        <textarea [(ngModel)]="newTaskText"></textarea>

        <label>Color</label>
        <input type="color" [(ngModel)]="newColor">

        <div class="task-buttons">
            <button (click)="addOrUpdateTask()">
                {{ editingTask ? 'Save Changes' : 'Add Task' }}
            </button>

            <button class="delete-btn" *ngIf="editingTask" (click)="deleteTask()">
                Delete
            </button>

            <button (click)="closeTaskBox()">Cancel</button>
        </div>
    </div>
</div>
